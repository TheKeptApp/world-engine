<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="1060" viewBox="0 0 1020 1060"><rect width="100%" height="100%" fill="#F4F8FC"/><style>text{font-family:Arial,sans-serif;fill:#173951} .title{font-size:28px;font-weight:bold} .label{font-size:19px;font-weight:bold} .body{font-size:16px}</style><text x="32" y="42" class="title">House details: phone projection + bevel</text><text x="32" y="76" class="body">390 layout px wide · 60° horizontal FOV · centre-frame planar feature · authored guidance</text><text x="32" y="110" class="body">px = 337.75 × width in metres / depth in metres; drawable px = layout px × device scale</text><text x="32" y="158" class="label">Feature width</text><text x="250" y="158" class="label">10 m</text><text x="500" y="158" class="label">25 m</text><text x="750" y="158" class="label">50 m</text><text x="32" y="202" class="body">100 cm</text><rect x="250" y="211" width="33.775" height="16" fill="#168B9D"/><text x="300" y="202" class="body">33.77 px</text><rect x="500" y="211" width="13.510" height="16" fill="#168B9D"/><text x="550" y="202" class="body">13.51 px</text><rect x="750" y="211" width="6.755" height="16" fill="#168B9D"/><text x="800" y="202" class="body">6.75 px</text><text x="32" y="270" class="body">30 cm</text><rect x="250" y="279" width="10.132" height="16" fill="#168B9D"/><text x="300" y="270" class="body">10.13 px</text><rect x="500" y="279" width="4.053" height="16" fill="#168B9D"/><text x="550" y="270" class="body">4.05 px</text><rect x="750" y="279" width="2.026" height="16" fill="#168B9D"/><text x="800" y="270" class="body">2.03 px</text><text x="32" y="338" class="body">10 cm</text><rect x="250" y="347" width="3.377" height="16" fill="#168B9D"/><text x="300" y="338" class="body">3.38 px</text><rect x="500" y="347" width="1.351" height="16" fill="#168B9D"/><text x="550" y="338" class="body">1.35 px</text><rect x="750" y="347" width="0.675" height="16" fill="#168B9D"/><text x="800" y="338" class="body">0.68 px</text><text x="32" y="406" class="body">4 cm</text><rect x="250" y="415" width="1.351" height="16" fill="#168B9D"/><text x="300" y="406" class="body">1.35 px</text><rect x="500" y="415" width="0.540" height="16" fill="#168B9D"/><text x="550" y="406" class="body">0.54 px</text><rect x="750" y="415" width="0.270" height="16" fill="#168B9D"/><text x="800" y="406" class="body">0.27 px</text><text x="32" y="474" class="body">2 cm</text><rect x="250" y="483" width="0.675" height="16" fill="#168B9D"/><text x="300" y="474" class="body">0.68 px</text><rect x="500" y="483" width="0.270" height="16" fill="#168B9D"/><text x="550" y="474" class="body">0.27 px</text><rect x="750" y="483" width="0.150" height="16" fill="#168B9D"/><text x="800" y="474" class="body">0.14 px</text><text x="32" y="568" class="label">M: geometry for silhouette, recess and shadow. P: broad colour mask. D: omit.</text><text x="32" y="601" class="body">Default: model ornament ≥1.5 px; paint marks ≥1 px; drop decoration below 0.75 px.</text><text x="32" y="631" class="body">Keep roofs, porch voids, courtyard wings, primary piers and bays even when thin.</text><text x="32" y="679" class="label">Wall corner cross-sections (enlarged diagrams, not real-size images)</text><path d="M75 728 H255 V878 H75 Z" fill="#D56935" stroke="#843D28" stroke-width="3"/><text x="75" y="911" class="label">0 cm: hard box</text><path d="M389 728 H555 V878 H375 V742 Z" fill="#D56935" stroke="#843D28" stroke-width="3"/><path d="M375 742 L389 728" stroke="#FFE4A2" stroke-width="6"/><text x="375" y="911" class="label">4 cm: target</text><path d="M741 728 H855 V878 H675 V794 Z" fill="#D56935" stroke="#843D28" stroke-width="3"/><path d="M675 794 L741 728" stroke="#FFE4A2" stroke-width="6"/><text x="675" y="911" class="label">20 cm: too soft</text><text x="32" y="962" class="body">Bevel offsets: walls 2.5–6 cm; masonry 2–4 cm; timber/trim 0.5–1.5 cm.</text><text x="32" y="993" class="body">Roof/fascia 1–2.5 cm; step noses 0.8–2 cm. Clamp ≤10% of member thickness.</text><text x="32" y="1024" class="body">Use 1–2 segments near; simplify loops with distance. Broad wall faces remain planar.</text></svg>