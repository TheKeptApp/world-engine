# XcodeGen spec for the WorldLab demo app. This file is the source of truth:
# scripts/generate.sh regenerates WorldLab.xcodeproj (git-ignored). Never edit the .xcodeproj.
name: WorldLab
options:
  bundleIdPrefix: com.lincolnlabs
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  WorldEngine:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  WorldLab:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
      # The demo area's data, bundled as a folder named "sloans-lake".
      - path: ../../Data/areas/sloans-lake
        type: folder
        buildPhase: resources
      # Generated, git-ignored, optional (scripts/generate.sh makes them):
      #   dog/      DogWell's dog for RealityKit (.usdz) and three.js (.glb), scripts/convert-dog.sh
      #   package/  the shared world package, scripts/export-package.sh
      #   dist/     the three.js renderer, web/build.mjs
      - path: ../../Generated/dog
        type: folder
        optional: true
        buildPhase: resources
      - path: ../../Generated/package
        type: folder
        optional: true
        buildPhase: resources
      - path: ../../web/dist
        type: folder
        optional: true
        buildPhase: resources
    entitlements:
      path: Generated/WorldLab.entitlements
      properties:
        # WeatherKit (explicit App ID com.lincolnlabs.worldlab; the wildcard App ID can't use it).
        com.apple.developer.weatherkit: true
    info:
      path: Generated/Info.plist
      properties:
        # The three.js renderer is served over loopback http (secure context for WebGPU).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: WorldEngine
        product: WorldEngine
      - package: WorldEngine
        product: WorldEnvironment
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lincolnlabs.worldlab
        PRODUCT_NAME: WorldLab
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WorldLab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        # Set when device testing starts (signing needs the Team ID).
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
