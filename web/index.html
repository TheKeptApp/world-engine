<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>WorldEngine web</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #view { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
  #view.frame16x9 { top: 50%; bottom: auto; height: calc(100vw * 9 / 16); transform: translateY(-50%); }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; left: 8px; top: calc(env(safe-area-inset-top) + 54px); padding: 6px; border-radius: 6px;
         background: rgba(0,0,0,.45); color: #fff; font: 500 11px/1.35 ui-monospace, Menlo, monospace; white-space: pre; pointer-events: none; }
  #attr { position: absolute; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 8px); padding: 4px 8px; border-radius: 6px;
          background: rgba(255,255,255,.85); color: #000; font: 12px -apple-system, system-ui, sans-serif; }
  #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff;
            font: 15px -apple-system, system-ui, sans-serif; pointer-events: none; }
</style>
</head>
<body>
<div id="view"><canvas id="c"></canvas><a id="attr" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a></div>
<div id="hud" hidden></div>
<div id="status">Loading world…</div>
<script type="module" src="app.js"></script>
<script type="module" src="credits.js" data-world-credits></script>
</body>
</html>
